[project]
name = "spec-md"
version = "0.1.0"
description = "Caption spec to Markdown converter (specconv) and validator (specval)"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false
# The tools run on Linux x86_64 only (this host and the Docker image).
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.workspace]
members = ["packages/common", "packages/specconv", "packages/specval"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit rule set, so lint results do not change when ruff's defaults do.
select = ["E", "F", "W", "I", "B", "UP"]
