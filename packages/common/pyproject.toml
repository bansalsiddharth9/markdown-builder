[project]
name = "common"
version = "0.1.0"
description = "Shared manifest schema and front matter read/write for specconv and specval"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
