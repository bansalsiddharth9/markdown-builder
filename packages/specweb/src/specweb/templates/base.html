<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Spec converter{% endblock %}</title>
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Spec converter</a>
    <nav>
      <a href="/">Upload</a>
      <a href="/jobs">Jobs</a>
      <a href="/library">Library</a>
      {% block nav_extra %}{% endblock %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="note">
    No accounts: everyone on this network can see and use every job.
    Converted files are for internal reference only; many standards are licensed documents.
  </footer>
</body>
</html>
