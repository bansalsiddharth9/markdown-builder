[project]
name = "specval"
version = "0.1.0"
description = "Independently validate specconv Markdown output against its sources"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4==4.15.0",
    "common",
    "html5lib==1.1",
    "lxml==6.1.3",
    "markdown-it-py==4.3.0",
    "pdfplumber==0.11.10",
    "pymarkdownlnt==0.9.42",
    "pypdf==7.1.1",
    "python-docx==1.2.0",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.6",
    "typer==0.27.3",
]

[project.scripts]
specval = "specval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specval"]

[tool.uv.sources]
common = { workspace = true }
