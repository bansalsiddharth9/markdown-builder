[project]
name = "specweb"
version = "0.1.0"
description = "Web UI for specconv and specval"
requires-python = ">=3.12,<3.13"
dependencies = [
    "common",
    "specconv",
    "specval",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.34",
    "huey==3.5.4",
    "sqlalchemy==2.1.9",
    "markdown-it-py==4.3.0",
    "nh3==0.3.8",
    "filetype==1.2.0",
    "pyyaml==6.0.3",
    "typer==0.27.3",
]

[project.scripts]
specweb = "specweb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specweb"]

[tool.uv.sources]
common = { workspace = true }
specconv = { workspace = true }
specval = { workspace = true }
